<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="256" height="256">
  <defs>
    <mask id="cut">
      <!-- 白 = 保留橙色，黑 = 镂空 -->
      <rect x="0" y="0" width="80" height="80" rx="7" fill="#fff"/>
      <g stroke="#000" fill="#000">
        <!-- 十字臂（贯通到边缘） -->
        <line x1="40" y1="0" x2="40" y2="80" stroke-width="9"/>
        <line x1="0" y1="40" x2="80" y2="40" stroke-width="9"/>
        <!-- 四条对角臂 -->
        <line x1="40" y1="40" x2="18" y2="18" stroke-width="7"/>
        <line x1="40" y1="40" x2="62" y2="18" stroke-width="7"/>
        <line x1="40" y1="40" x2="62" y2="62" stroke-width="7"/>
        <line x1="40" y1="40" x2="18" y2="62" stroke-width="7"/>
        <!-- 对角臂末端圆点 -->
        <circle cx="18" cy="18" r="8.5" stroke="none"/>
        <circle cx="62" cy="18" r="8.5" stroke="none"/>
        <circle cx="62" cy="62" r="8.5" stroke="none"/>
        <circle cx="18" cy="62" r="8.5" stroke="none"/>
        <!-- 更多的清理 -->
        <line x1="47" y1="50" x2="40" y2="57" stroke-width="2"/>
        <line x1="47" y1="30" x2="40" y2="37" stroke-width="2"/>
      </g>
    </mask>
    <mask id="detail">
      <rect x="0" y="0" width="80" height="80" rx="7" fill="#fff"/>
      <g stroke="#000" fill="#000">
        <line x1="47" y1="50" x2="40" y2="57" stroke-width="2"/>
        <line x1="47" y1="30" x2="40" y2="37" stroke-width="2"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="80" height="80" rx="7" fill="#B97823" mask="url(#cut)"/>
  <g stroke="#B97823" fill="#B97823" mask="url(#detail)">
    <line x1="50" y1="20" x2="20" y2="50" stroke-width="7"/>
    <line x1="50" y1="60" x2="20" y2="30" stroke-width="7"/>
    <line x1="30" y1="60" x2="60" y2="30" stroke-width="7"/>
    <line x1="30" y1="20" x2="60" y2="50" stroke-width="7"/>
  </g>
</svg>
